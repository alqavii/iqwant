<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IQwant — Digits Memory Span</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0d;
      --surface: #101217;
      --surface-card: #0d0f13;
      --surface-hover: #15181f;
      --border: #1b1f27;
      --border-hover: #2d3340;
      --text: #ededed;
      --text-muted: #848b98;
      --text-dim: #4f5664;
      --green: #2fa872;
      --red: #df4a56;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(9, 10, 13, 0.85);
      backdrop-filter: blur(12px);
    }
    .nav-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.875rem; font-weight: 500; }
    .nav-links a:hover { color: var(--text); }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .panel {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 32px;
      text-align: center;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p.lead {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .mode-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .mode-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .mode-btn:hover { border-color: var(--border-hover); color: var(--text); }
    .mode-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-weight: 600;
    }

    .sliders-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 28px;
      text-align: left;
    }
    .slider-group label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-family: var(--font-mono);
    }
    .slider-group input { width: 100%; accent-color: var(--text-muted); }

    .boxes-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 32px 0;
      min-height: 70px;
      flex-wrap: wrap;
    }
    .digit-box {
      width: 52px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text);
      transition: border-color 0.1s ease, background 0.1s ease;
    }
    .digit-box.active {
      border-color: var(--text-muted);
      background: var(--surface-hover);
    }
    .digit-box.hidden { color: transparent; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--text);
      color: var(--bg);
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .btn-submit:hover:not(:disabled) { opacity: 0.9; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .input-section { margin-top: 20px; display: none; }
    .number-input {
      background: var(--surface);
      border: 1px solid var(--border-hover);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 1.8rem;
      font-weight: 600;
      text-align: center;
      padding: 8px 16px;
      width: 240px;
      outline: none;
      margin-bottom: 14px;
    }
    .number-input:focus { border-color: var(--text-muted); }

    .result-text {
      font-size: 0.92rem;
      font-family: var(--font-mono);
      margin-top: 16px;
      min-height: 24px;
    }
    .res-correct { color: var(--green); }
    .res-wrong { color: var(--red); }

    .log-wrap {
      margin-top: 28px;
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 220px;
      overflow-y: auto;
      text-align: left;
    }
    .log-tbl { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .log-tbl th, .log-tbl td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .log-tbl th { background: var(--surface); color: var(--text-dim); font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">IQwant</a>
      <div class="nav-links">
        <a href="index.html">← Dashboard</a>
        <a href="optiver80.html">80 in 8</a>
        <a href="questions.html">Question Bank</a>
      </div>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="eyebrow">Cognitive Retention</div>
      <h1>Digits Memory Span</h1>
      <p class="lead">Modeled on Citadel (Pymetrics Digits) and Optiver working memory screens. Evaluates phonological loop capacity and mental manipulation under speed constraints.</p>

      <div class="mode-bar">
        <button class="mode-btn active" id="btnNormal" onclick="setMode('normal')">Forward Span</button>
        <button class="mode-btn" id="btnReverse" onclick="setMode('reverse')">Reverse Span</button>
        <button class="mode-btn" id="btnSorted" onclick="setMode('sorted')">Descending Order</button>
      </div>

      <div class="sliders-panel">
        <div class="slider-group">
          <label>Flash Duration: <span id="speedValue">0.5</span>s / digit</label>
          <input type="range" id="speedSlider" min="0.2" max="1.2" step="0.1" value="0.5">
        </div>
        <div class="slider-group">
          <label>Sequence Length: <span id="boxValue">8</span> digits</label>
          <input type="range" id="boxSlider" min="4" max="10" step="1" value="8">
        </div>
      </div>

      <div class="boxes-container" id="boxes"></div>

      <button id="startBtn" class="btn-submit" onclick="startGame()">Start Sequence</button>

      <div id="inputSection" class="input-section">
        <input type="text" id="userInput" class="number-input" placeholder="Enter sequence" maxlength="10">
        <br>
        <button class="btn-submit" style="max-width:180px; padding:10px;" onclick="checkAnswer()">Submit [Enter]</button>
      </div>

      <div id="resultText" class="result-text"></div>

      <div class="log-wrap" id="historyCard" style="display:none;">
        <table class="log-tbl">
          <thead>
            <tr>
              <th>#</th>
              <th>Mode</th>
              <th>Target</th>
              <th>Input</th>
              <th>Status</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let currentMode = 'normal';
    let numberOfBoxes = 8;
    let flashingSpeed = 500;
    let randomNumber = "";
    let startTime = 0;
    let attemptCount = 0;
    let audioCtx = null;

    function playBeep(freq, dur) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    const speedSlider = document.getElementById('speedSlider');
    const boxSlider = document.getElementById('boxSlider');

    speedSlider.addEventListener('input', () => {
      flashingSpeed = parseFloat(speedSlider.value) * 1000;
      document.getElementById('speedValue').textContent = speedSlider.value;
    });

    boxSlider.addEventListener('input', () => {
      numberOfBoxes = parseInt(boxSlider.value, 10);
      document.getElementById('boxValue').textContent = boxSlider.value;
      createBoxes();
    });

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      if (mode === 'normal') document.getElementById('btnNormal').classList.add('active');
      if (mode === 'reverse') document.getElementById('btnReverse').classList.add('active');
      if (mode === 'sorted') document.getElementById('btnSorted').classList.add('active');
    }

    function createBoxes() {
      const c = document.getElementById('boxes');
      c.innerHTML = '';
      for (let i = 0; i < numberOfBoxes; i++) {
        const box = document.createElement('div');
        box.classList.add('digit-box', 'hidden');
        c.appendChild(box);
      }
    }

    function generateNumber() {
      randomNumber = '';
      for (let i = 0; i < numberOfBoxes; i++) {
        randomNumber += Math.floor(Math.random() * 10).toString();
      }
    }

    function startGame() {
      document.getElementById('startBtn').disabled = true;
      document.getElementById('inputSection').style.display = 'none';
      document.getElementById('resultText').textContent = '';
      document.getElementById('userInput').value = '';
      generateNumber();
      createBoxes();

      const boxes = document.querySelectorAll('.digit-box');
      let index = 0;

      const timer = setInterval(() => {
        if (index > 0) {
          boxes[index - 1].classList.remove('active');
          boxes[index - 1].classList.add('hidden');
        }
        if (index < numberOfBoxes) {
          boxes[index].textContent = randomNumber[index];
          boxes[index].classList.remove('hidden');
          boxes[index].classList.add('active');
          playBeep(420 + (index * 25), 0.08);
          index++;
        } else {
          clearInterval(timer);
          boxes[index - 1].classList.remove('active');
          boxes[index - 1].classList.add('hidden');
          document.getElementById('inputSection').style.display = 'block';
          const inp = document.getElementById('userInput');
          inp.focus();
          startTime = Date.now();
          document.getElementById('startBtn').disabled = false;
        }
      }, flashingSpeed);
    }

    function transformNumber() {
      if (currentMode === 'reverse') return randomNumber.split('').reverse().join('');
      if (currentMode === 'sorted') return randomNumber.split('').sort((a,b) => b - a).join('');
      return randomNumber;
    }

    function checkAnswer() {
      const val = document.getElementById('userInput').value.trim();
      const target = transformNumber();
      const timeTaken = ((Date.now() - startTime) / 1000).toFixed(1);
      const isCorrect = val === target;
      attemptCount++;

      const resEl = document.getElementById('resultText');
      if (isCorrect) {
        resEl.textContent = `Correct sequence (${timeTaken}s)`;
        resEl.className = 'result-text res-correct';
        playBeep(620, 0.12);
      } else {
        resEl.textContent = `Incorrect. Expected: ${target}`;
        resEl.className = 'result-text res-wrong';
        playBeep(200, 0.15);
      }

      document.getElementById('historyCard').style.display = 'block';
      const tbody = document.getElementById('historyBody');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="color:var(--text-dim);">${attemptCount}</td>
        <td style="font-family:var(--font-mono);">${currentMode.toUpperCase()}</td>
        <td style="font-family:var(--font-mono);">${target}</td>
        <td style="font-family:var(--font-mono);">${val}</td>
        <td style="color:${isCorrect ? 'var(--green)' : 'var(--red)'}; font-family:var(--font-mono); font-weight:600;">${isCorrect ? 'OK' : 'ERR'}</td>
        <td style="font-family:var(--font-mono); color:var(--text-dim);">${timeTaken}s</td>
      `;
      tbody.prepend(tr);

      document.getElementById('inputSection').style.display = 'none';
    }

    document.getElementById('userInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkAnswer();
    });

    createBoxes();
  </script>
</body>
</html>
