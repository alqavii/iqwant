<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IQwant - Working Memory & Digits Span</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05060a;
      --glass: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.12);
      --primary: #8b5cf6;
      --primary-strong: #6d28d9;
      --accent: #38bdf8;
      --ok: #22c55e;
      --bad: #ef4444;
      --text: #ffffff;
      --subtext: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.15), transparent 60%),
                  radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.1), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    nav {
      width: 100%;
      max-width: 1200px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-size: 1.8rem;
      font-weight: 800;
    }
    .brand .iq {
      background: linear-gradient(90deg, #a78bfa, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand .want { color: #fff; }
    .nav-links { display: flex; gap: 16px; align-items: center; }
    .nav-links a { color: var(--subtext); text-decoration: none; font-size: 0.95rem; font-weight: 600; }
    .nav-links a:hover { color: #fff; }

    .container {
      width: min(920px, 94vw);
      position: relative;
      z-index: 1;
      padding: 30px 0 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .glass-card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(139, 92, 246, 0.15);
      padding: 32px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 14px;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid var(--primary);
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #c4b5fd;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; }
    p.subtitle { color: var(--subtext); font-size: 1rem; max-width: 600px; margin: 0 auto 24px; line-height: 1.5; }

    .mode-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .mode-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active, .mode-btn:hover {
      background: rgba(139, 92, 246, 0.25);
      border-color: var(--primary);
      color: white;
    }

    .sliders-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      background: rgba(0,0,0,0.3);
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 24px;
      text-align: left;
    }
    @media (max-width: 600px) { .sliders-panel { grid-template-columns: 1fr; } }

    .slider-group label { display: block; font-size: 0.85rem; color: var(--subtext); font-weight: 600; margin-bottom: 8px; }
    .slider-group input { width: 100%; accent-color: var(--primary); }

    /* Box Container */
    .boxes-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 30px 0;
      min-height: 80px;
      flex-wrap: wrap;
    }
    .digit-box {
      width: 65px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.2rem;
      font-weight: 800;
      color: white;
      transition: all 0.15s ease;
    }
    .digit-box.active {
      border-color: #a855f7;
      background: rgba(139, 92, 246, 0.3);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
      transform: scale(1.08);
      color: #ffffff;
    }
    .digit-box.hidden { color: transparent; }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: white;
      font-size: 1.2rem;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      padding: 16px 36px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
      transition: all 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(139, 92, 246, 0.6);
    }

    .input-section {
      margin-top: 20px;
      display: none;
    }
    .number-input {
      background: rgba(0,0,0,0.5);
      border: 2px solid var(--primary);
      border-radius: 12px;
      color: white;
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      padding: 12px;
      width: 280px;
      outline: none;
      margin-bottom: 16px;
    }
    .result-text {
      font-size: 1.2rem;
      font-weight: 700;
      margin-top: 16px;
      min-height: 30px;
    }
    .res-correct { color: var(--ok); }
    .res-wrong { color: var(--bad); }

    .history-card {
      margin-top: 24px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 16px;
      max-height: 250px;
      overflow-y: auto;
    }
    .history-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
    .history-table th, .history-table td { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .history-table th { color: var(--subtext); }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="brand">
      <span class="iq">IQ</span><span class="want">want</span>
    </a>
    <div class="nav-links">
      <a href="index.html">← All Games</a>
      <a href="optiver80.html">80 in 8</a>
      <a href="balloon.html">Balloon BART</a>
      <a href="questions.html">Question Banks</a>
    </div>
  </nav>

  <div class="container">
    <div class="glass-card">
      <span class="badge">Cognitive Assessment</span>
      <h1>Working Memory & Digits Span</h1>
      <p class="subtitle">Used by Optiver and Citadel (Pymetrics Digits) to test rapid short-term working memory encoding, manipulation, and retrieval latency.</p>

      <div class="mode-bar">
        <button class="mode-btn active" id="btnNormal" onclick="setMode('normal')">Forward Span</button>
        <button class="mode-btn" id="btnReverse" onclick="setMode('reverse')">Reverse Span (Pymetrics)</button>
        <button class="mode-btn" id="btnSorted" onclick="setMode('sorted')">Descending Sorted Span</button>
      </div>

      <div class="sliders-panel">
        <div class="slider-group">
          <label>Flash Speed: <span id="speedValue" style="color:var(--accent); font-weight:700;">0.5</span>s per digit</label>
          <input type="range" id="speedSlider" min="0.2" max="1.2" step="0.1" value="0.5">
        </div>
        <div class="slider-group">
          <label>Number of Digits: <span id="boxValue" style="color:var(--primary); font-weight:700;">8</span> digits</label>
          <input type="range" id="boxSlider" min="4" max="10" step="1" value="8">
        </div>
      </div>

      <div class="boxes-container" id="boxes"></div>

      <button id="startBtn" class="btn-primary" onclick="startGame()">Start Flash Sequence</button>

      <div id="inputSection" class="input-section">
        <input type="text" id="userInput" class="number-input" placeholder="Type sequence & Enter" maxlength="10">
        <br>
        <button class="btn-primary" style="padding: 12px 28px; font-size:1rem;" onclick="checkAnswer()">Submit Sequence</button>
      </div>

      <div id="resultText" class="result-text"></div>

      <div class="history-card" id="historyCard" style="display:none;">
        <h4 style="color:var(--subtext); margin-bottom:8px; font-size:0.9rem; text-transform:uppercase;">Session Log</h4>
        <table class="history-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Mode</th>
              <th>Target</th>
              <th>Your Input</th>
              <th>Status</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'normal';
    let numberOfBoxes = 8;
    let flashingSpeed = 500;
    let randomNumber = "";
    let startTime = 0;
    let attemptCount = 0;
    let audioCtx = null;

    function playBeep(freq, dur) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    const speedSlider = document.getElementById('speedSlider');
    const boxSlider = document.getElementById('boxSlider');

    speedSlider.addEventListener('input', () => {
      flashingSpeed = parseFloat(speedSlider.value) * 1000;
      document.getElementById('speedValue').textContent = speedSlider.value;
    });

    boxSlider.addEventListener('input', () => {
      numberOfBoxes = parseInt(boxSlider.value, 10);
      document.getElementById('boxValue').textContent = boxSlider.value;
      createBoxes();
    });

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      if (mode === 'normal') document.getElementById('btnNormal').classList.add('active');
      if (mode === 'reverse') document.getElementById('btnReverse').classList.add('active');
      if (mode === 'sorted') document.getElementById('btnSorted').classList.add('active');
    }

    function createBoxes() {
      const c = document.getElementById('boxes');
      c.innerHTML = '';
      for (let i = 0; i < numberOfBoxes; i++) {
        const box = document.createElement('div');
        box.classList.add('digit-box', 'hidden');
        c.appendChild(box);
      }
    }

    function generateNumber() {
      randomNumber = '';
      for (let i = 0; i < numberOfBoxes; i++) {
        randomNumber += Math.floor(Math.random() * 10).toString();
      }
    }

    function startGame() {
      document.getElementById('startBtn').disabled = true;
      document.getElementById('inputSection').style.display = 'none';
      document.getElementById('resultText').textContent = '';
      document.getElementById('userInput').value = '';
      generateNumber();
      createBoxes();

      const boxes = document.querySelectorAll('.digit-box');
      let index = 0;

      const timer = setInterval(() => {
        if (index > 0) {
          boxes[index - 1].classList.remove('active');
          boxes[index - 1].classList.add('hidden');
        }
        if (index < numberOfBoxes) {
          boxes[index].textContent = randomNumber[index];
          boxes[index].classList.remove('hidden');
          boxes[index].classList.add('active');
          playBeep(440 + (index * 40), 0.1);
          index++;
        } else {
          clearInterval(timer);
          boxes[index - 1].classList.remove('active');
          boxes[index - 1].classList.add('hidden');
          document.getElementById('inputSection').style.display = 'block';
          const inp = document.getElementById('userInput');
          inp.focus();
          startTime = Date.now();
          document.getElementById('startBtn').disabled = false;
        }
      }, flashingSpeed);
    }

    function transformNumber() {
      if (currentMode === 'reverse') return randomNumber.split('').reverse().join('');
      if (currentMode === 'sorted') return randomNumber.split('').sort((a,b) => b - a).join('');
      return randomNumber;
    }

    function checkAnswer() {
      const val = document.getElementById('userInput').value.trim();
      const target = transformNumber();
      const timeTaken = ((Date.now() - startTime) / 1000).toFixed(1);
      const isCorrect = val === target;
      attemptCount++;

      const resEl = document.getElementById('resultText');
      if (isCorrect) {
        resEl.textContent = `✓ Correct! Sequence decoded in ${timeTaken}s`;
        resEl.className = 'result-text res-correct';
        playBeep(880, 0.2);
      } else {
        resEl.textContent = `✗ Incorrect. Expected: ${target} (Input: ${val || 'empty'})`;
        resEl.className = 'result-text res-wrong';
        playBeep(220, 0.3);
      }

      // Add to session history
      document.getElementById('historyCard').style.display = 'block';
      const tbody = document.getElementById('historyBody');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${attemptCount}</td>
        <td>${currentMode.toUpperCase()}</td>
        <td style="font-family:'JetBrains Mono';">${target}</td>
        <td style="font-family:'JetBrains Mono';">${val}</td>
        <td style="color:${isCorrect ? 'var(--ok)' : 'var(--bad)'}; font-weight:700;">${isCorrect ? 'CORRECT' : 'WRONG'}</td>
        <td>${timeTaken}s</td>
      `;
      tbody.prepend(tr);

      document.getElementById('inputSection').style.display = 'none';
    }

    document.getElementById('userInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkAnswer();
    });

    createBoxes();
  </script>
</body>
</html>
