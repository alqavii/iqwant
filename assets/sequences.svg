<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgSeq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgSeq)"/>

  <!-- Sequence Blocks with Question Mark at the end -->
  <g transform="translate(110, 240)">
    <!-- Block 1 -->
    <rect x="0" y="0" width="100" height="100" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <text x="50" y="65" font-family="'DM Sans', Arial" font-size="38" font-weight="900" fill="#38bdf8" text-anchor="middle">3</text>
    
    <!-- Arrow -->
    <text x="120" y="60" font-size="28" fill="#64748b" text-anchor="middle">→</text>

    <!-- Block 2 -->
    <rect x="140" y="0" width="100" height="100" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <text x="190" y="65" font-family="'DM Sans', Arial" font-size="38" font-weight="900" fill="#38bdf8" text-anchor="middle">7</text>

    <!-- Arrow -->
    <text x="260" y="60" font-size="28" fill="#64748b" text-anchor="middle">→</text>

    <!-- Block 3 -->
    <rect x="280" y="0" width="100" height="100" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <text x="330" y="65" font-family="'DM Sans', Arial" font-size="38" font-weight="900" fill="#38bdf8" text-anchor="middle">15</text>

    <!-- Arrow -->
    <text x="400" y="60" font-size="28" fill="#64748b" text-anchor="middle">→</text>

    <!-- Block 4 -->
    <rect x="420" y="0" width="100" height="100" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <text x="470" y="65" font-family="'DM Sans', Arial" font-size="38" font-weight="900" fill="#38bdf8" text-anchor="middle">31</text>

    <!-- Arrow -->
    <text x="540" y="60" font-size="28" fill="#64748b" text-anchor="middle">→</text>

    <!-- Target Block (?) -->
    <rect x="560" y="0" width="100" height="100" rx="16" fill="rgba(139, 92, 246, 0.25)" stroke="#a855f7" stroke-width="4" filter="drop-shadow(0 0 15px rgba(168,85,247,0.7))"/>
    <text x="610" y="68" font-family="'DM Sans', Arial" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">?</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(260, 120)">
    <rect x="0" y="0" width="280" height="50" rx="25" fill="#334155" opacity="0.5"/>
    <text x="140" y="33" font-family="'DM Sans', Arial" font-size="20" font-weight="bold" fill="#e2e8f0" text-anchor="middle">2n + 1 RECURSION</text>
  </g>
</svg>
