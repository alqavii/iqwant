<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgBART" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140b2b"/>
      <stop offset="100%" stop-color="#070913"/>
    </linearGradient>
    <radialGradient id="balloonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="60%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgBART)"/>
  
  <!-- Balloon Shape -->
  <g transform="translate(400, 260)">
    <!-- String -->
    <path d="M 0,140 Q 15,190 -10,230 T 10,270" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <!-- Balloon Body -->
    <ellipse cx="0" cy="0" rx="140" ry="160" fill="url(#balloonGrad)" filter="drop-shadow(0 0 35px rgba(244,63,94,0.4))"/>
    <!-- Highlight -->
    <ellipse cx="-45" cy="-55" rx="35" ry="50" fill="rgba(255,255,255,0.3)" transform="rotate(-25, -45, -55)"/>
    <!-- Knot -->
    <polygon points="-16,148 16,148 0,165" fill="#9f1239"/>
    
    <!-- Pumping meter / Risk indicators -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="0" y="10" font-family="'DM Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">PUMP $</text>
  </g>

  <!-- Bank / Coins -->
  <g transform="translate(180, 420)">
    <circle cx="40" cy="40" r="34" fill="url(#coinGrad)" stroke="#fef08a" stroke-width="3"/>
    <text x="40" y="52" font-family="Arial" font-size="32" font-weight="bold" fill="#78350f" text-anchor="middle">$</text>
    <circle cx="85" cy="50" r="28" fill="url(#coinGrad)" stroke="#fef08a" stroke-width="3"/>
    <text x="85" y="60" font-family="Arial" font-size="26" font-weight="bold" fill="#78350f" text-anchor="middle">$</text>
  </g>
  
  <!-- Risk indicator gauge badge -->
  <g transform="translate(530, 110)">
    <rect x="0" y="0" width="170" height="48" rx="24" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="2"/>
    <text x="85" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f87171" text-anchor="middle">BURST RISK: 18%</text>
  </g>
</svg>
