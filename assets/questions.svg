<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgQues" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgQues)"/>

  <!-- Open Question Book & Formula Cards -->
  <g transform="translate(180, 140)">
    <!-- Book pages -->
    <path d="M 220,90 Q 320,60 420,90 L 420,330 Q 320,290 220,320 Z" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <path d="M 220,90 Q 120,60 20,90 L 20,330 Q 120,290 220,320 Z" fill="#0f172a" stroke="#334155" stroke-width="4"/>
    <line x1="220" y1="85" x2="220" y2="330" stroke="#8b5cf6" stroke-width="6"/>

    <!-- Left Page Content: Formulas -->
    <text x="60" y="150" font-family="'Courier New', monospace" font-size="20" fill="#38bdf8" font-weight="bold">P(A|B) = P(B|A)P(A)</text>
    <text x="145" y="180" font-family="'Courier New', monospace" font-size="20" fill="#38bdf8" font-weight="bold">───────────────</text>
    <text x="175" y="210" font-family="'Courier New', monospace" font-size="20" fill="#38bdf8" font-weight="bold">P(B)</text>
    <text x="60" y="260" font-family="'Courier New', monospace" font-size="22" fill="#a855f7" font-weight="bold">E[X] = ∑ x · P(x)</text>

    <!-- Right Page Content: Brainteaser / Finance -->
    <text x="250" y="160" font-family="'DM Sans', Arial" font-size="24" fill="#facc15" font-weight="bold">💡 Dice EV & Skew</text>
    <text x="250" y="200" font-family="'DM Sans', Arial" font-size="20" fill="#94a3b8">dF = μS dt + σS dW</text>
    <text x="250" y="240" font-family="'DM Sans', Arial" font-size="20" fill="#4ade80">Crack Spread 3:2:1</text>
    <text x="250" y="280" font-family="'DM Sans', Arial" font-size="20" fill="#f43f5e">Put-Call Parity</text>
  </g>

  <!-- Glowing Badge -->
  <g transform="translate(330, 80)">
    <circle cx="70" cy="40" r="45" fill="#8b5cf6" filter="drop-shadow(0 0 20px rgba(139,92,246,0.9))"/>
    <text x="70" y="52" font-family="'DM Sans', Arial" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">?</text>
  </g>
</svg>
