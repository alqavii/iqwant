<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgComp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="100%" stop-color="#080711"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgComp)"/>

  <!-- Skyline / Skyscrapers of Trading Hubs (Chicago, Amsterdam, London, Singapore, NYC) -->
  <g transform="translate(150, 160)">
    <!-- Buildings -->
    <rect x="20" y="140" width="80" height="220" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="120" y="80" width="90" height="280" fill="#0f172a" stroke="#8b5cf6" stroke-width="3"/>
    <rect x="230" y="40" width="100" height="320" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Spire on main tower -->
    <line x1="280" y1="40" x2="280" y2="0" stroke="#a855f7" stroke-width="4"/>
    <circle cx="280" cy="0" r="5" fill="#ec4899" filter="drop-shadow(0 0 8px #ec4899)"/>
    
    <rect x="350" y="100" width="80" height="260" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="450" y="160" width="70" height="200" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- Windows (dots) -->
    <g fill="#38bdf8" opacity="0.6">
      <circle cx="150" cy="110" r="3"/><circle cx="170" cy="110" r="3"/><circle cx="190" cy="110" r="3"/>
      <circle cx="150" cy="140" r="3"/><circle cx="170" cy="140" r="3"/><circle cx="190" cy="140" r="3"/>
      <circle cx="150" cy="170" r="3"/><circle cx="170" cy="170" r="3"/><circle cx="190" cy="170" r="3"/>
      <circle cx="260" cy="70" r="3"/><circle cx="280" cy="70" r="3"/><circle cx="300" cy="70" r="3"/>
      <circle cx="260" cy="100" r="3"/><circle cx="280" cy="100" r="3"/><circle cx="300" cy="100" r="3"/>
      <circle cx="260" cy="130" r="3"/><circle cx="280" cy="130" r="3"/><circle cx="300" cy="130" r="3"/>
    </g>

    <!-- Trading Logos / Tickers Bar -->
    <rect x="0" y="360" width="540" height="15" fill="#6366f1"/>
  </g>

  <!-- Firm Name Badges Floating -->
  <g font-family="'DM Sans', Arial" font-size="16" font-weight="bold">
    <rect x="120" y="90" width="130" height="36" rx="18" fill="rgba(139, 92, 246, 0.3)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="185" y="114" fill="#ffffff" text-anchor="middle">OPTIVER</text>

    <rect x="330" y="60" width="150" height="36" rx="18" fill="rgba(56, 189, 248, 0.3)" stroke="#38bdf8" stroke-width="2"/>
    <text x="405" y="84" fill="#ffffff" text-anchor="middle">JANE STREET</text>

    <rect x="540" y="110" width="140" height="36" rx="18" fill="rgba(245, 158, 11, 0.3)" stroke="#f59e0b" stroke-width="2"/>
    <text x="610" y="134" fill="#ffffff" text-anchor="middle">TRAFIGURA</text>
  </g>
</svg>
