  <style>
    :root {
      --bg: #090a0d;
      --surface: #101217;
      --surface-card: #0d0f13;
      --surface-hover: #15181f;
      --border: #1b1f27;
      --border-hover: #2d3340;

      --green: #2fa872;

    body {

      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;

      font-weight: 700;

      text-decoration: none;

    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.875rem; font-weight: 500; }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }

    .hero-banner { margin-bottom: 32px; }
    .eyebrow {
      font-family: var(--font-mono);

      color: var(--text-dim);
      text-transform: uppercase;

      margin-bottom: 8px;

      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;

      font-size: 0.95rem;

      transition: all 0.15s ease;

    .filter-btn:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }
    .filter-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-weight: 600;

    .search-row {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
    }
    .search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);

      outline: none;

    .q-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .q-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);

    .q-actions {

      color: var(--text-muted);
      padding: 6px 12px;

  <script>
    const QUESTIONS_DATA = [
      // ==================== COMMODITIES SECTION ====================
      {
        id: "comm-01",
        category: "commodities",
        difficulty: "hard",
        firms: ["Trafigura", "Glencore", "Vitol"],
        title: "Cash-and-Carry Storage Arbitrage & Full Carry Contango",
        prompt: `Spot crude oil is trading at <strong>$72.00 / bbl</strong>. The 6-month forward contract is trading at <strong>$77.50 / bbl</strong>.<br>
Storage tank rent is <strong>$0.55 / bbl / month</strong> payable monthly in advance. The risk-free interest rate is <strong>5.0% annualized</strong> (simple interest). Physical insurance and inspection costs are <strong>$0.05 / bbl / month</strong>.<br>
<strong>Question:</strong> Is there an arbitrage opportunity? What exact trade would you execute, what is your net profit per 500,000-barrel cargo, and what is the "Full Carry" forward price?`,
        solution: `<strong>1. Concept:</strong> Storage Arbitrage (Cash-and-Carry) exploits an over-priced forward curve in contango where the forward price exceeds spot plus all carrying costs (Full Carry).<br><br>
<strong>2. Calculate Total Carrying Costs for 6 Months:</strong><br>
• Financing cost (Interest): $72.00 × 5% × (6/12) = <strong>$1.80 / bbl</strong>.<br>
• Tank storage fees: 6 months × $0.55 = <strong>$3.30 / bbl</strong>.<br>
• Insurance & inspection: 6 months × $0.05 = <strong>$0.30 / bbl</strong>.<br>
• <strong>Total Cost of Carry:</strong> $1.80 + $3.30 + $0.30 = <strong>$5.40 / bbl</strong>.<br><br>
<strong>3. Full Carry Price:</strong><br>
Full Carry Forward = Spot + Carry = $72.00 + $5.40 = <strong>$77.40 / bbl</strong>.<br><br>
<strong>4. Arbitrage Evaluation:</strong><br>
Actual Forward Price = $77.50 > Full Carry ($77.40).<br>
Yes, an arbitrage exists! Net profit = $77.50 - $77.40 = <strong>+$0.10 / bbl</strong> (risk-free).<br><br>
<strong>5. Execution Steps:</strong><br>
• Buy 500,000 bbl spot oil at $72.00 (borrow $36M at 5%).<br>
• Simultaneously sell 500 futures/forward contracts for delivery in 6 months at $77.50.<br>
• Inject oil into leased storage tanks.<br>
• Deliver into the forward contract in Month 6.<br>
• <strong>Net P&L on Cargo:</strong> 500,000 bbl × $0.10 = <strong>+$50,000 locked in risk-free</strong>.`
      },
      {
        id: "comm-02",
        category: "commodities",
        difficulty: "hard",
        firms: ["Vitol", "BP Trading", "Shell Trading"],
        title: "The 3:2:1 Refinery Crack Spread Calculation & Hedging",
        prompt: `A complex refinery on the US Gulf Coast processes WTI crude into RBOB gasoline and Ultra-Low Sulfur Diesel (ULSD / Heating Oil).<br>
Current prices:<br>
• WTI Crude Oil: <strong>$80.00 / bbl</strong><br>
• RBOB Gasoline: <strong>$2.50 / gallon</strong><br>
• ULSD Diesel: <strong>$2.80 / gallon</strong><br>
<strong>Questions:</strong><br>
1. Calculate the 3:2:1 crack spread margin per barrel of crude.<br>
2. If refinery operational refining cost (opex) is $5.50/bbl, what is the net refining margin?<br>
3. How would you hedge 30,000 barrels of crude processing exposure on NYMEX?`,
        solution: `<strong>1. Understanding 3:2:1 Crack Spread:</strong><br>
Refineries crack 3 barrels of crude into 2 barrels of gasoline and 1 barrel of distillate.<br>
Remember: 1 barrel = <strong>42 US gallons</strong>.<br><br>
<strong>Convert Product Prices from $/gal to $/bbl:</strong><br>
• Gasoline: $2.50 × 42 = <strong>$105.00 / bbl</strong>.<br>
• Diesel: $2.80 × 42 = <strong>$117.60 / bbl</strong>.<br><br>
<strong>Total Revenue from 3 barrels of products:</strong><br>
Revenue = (2 × $105.00) + (1 × $117.60) = $210.00 + $117.60 = <strong>$327.60</strong>.<br>
<strong>Total Cost of 3 barrels of crude:</strong><br>
Cost = 3 × $80.00 = <strong>$240.00</strong>.<br><br>
<strong>Gross Crack Spread:</strong><br>
Total Margin for 3 barrels = $327.60 - $240.00 = $87.60.<br>
Per barrel of crude cracked = $87.60 / 3 = <strong>$29.20 / bbl</strong>.<br><br>
<strong>2. Net Refining Margin:</strong><br>
Net Margin = Gross Margin - Opex = $29.20 - $5.50 = <strong>$23.70 / bbl</strong>.<br><br>
<strong>3. Hedging Position for 30,000 bbls:</strong><br>
To lock in the crack spread margin for 30,000 barrels of crude (30 contracts on NYMEX):<br>
• <strong>Buy 30 NYMEX WTI Crude futures</strong> (hedges input cost).<br>
• <strong>Sell 20 NYMEX RBOB Gasoline futures</strong> (hedges output revenue).<br>
• <strong>Sell 10 NYMEX Heating Oil (ULSD) futures</strong> (hedges output revenue).`
      },
      {
        id: "comm-03",
        category: "commodities",
        difficulty: "medium",
        firms: ["Trafigura", "Gunvor", "Mercuria"],
        title: "Contango vs. Backwardation & Convenience Yield",
        prompt: `Explain the fundamental concept of <strong>Convenience Yield</strong>. Why is a deep backwardation market impossible to arbitrage on the short side (cash-and-carry vs reverse cash-and-carry asymmetry)?`,
        solution: `<strong>1. Definition of Convenience Yield ($y$):</strong><br>
Convenience yield is the implied benefit or premium associated with holding physical inventory of a commodity rather than holding a derivative contract. It reflects the operational advantage of having immediate supply to prevent factory shutdowns, meet unexpected delivery spikes, or capture immediate physical price premiums.<br><br>
<strong>2. Fundamental Pricing Equation:</strong><br>
<code>F_0 = S_0 × e^{(r + u - y)T}</code><br>
Where $r$ = interest rate, $u$ = storage & insurance cost, and $y$ = convenience yield.<br>
• When $y < r + u$, the market is in <strong>Contango</strong> (forward > spot).<br>
• When $y > r + u$, the market is in <strong>Backwardation</strong> (spot > forward). Deep backwardation indicates extreme physical scarcity today.<br><br>
<strong>3. The Arbitrage Asymmetry:</strong><br>
• <strong>Contango Arbitrage (Cash-and-Carry) has no physical ceiling:</strong> If forward is too high, anyone with capital can buy spot, lease tanks, sell futures, and lock in profit. Storage capacity is the only constraint.<br>
• <strong>Backwardation Arbitrage (Reverse Cash-and-Carry) has a hard physical floor:</strong> To exploit forward < spot, you must short spot oil and buy futures. But you cannot short physical oil unless you already own oil that you can draw down or can borrow it! Once global working inventories hit 'tank bottoms' (minimum operational levels), no more oil can be sold. Therefore, backwardation can widen indefinitely during supply shocks (e.g. wartime or pipeline outages).`
      },
      {
        id: "comm-04",
        category: "commodities",
        difficulty: "hard",
        firms: ["Trafigura", "Glencore"],
        title: "Physical Trading Logistics: Laytime, Demurrage & Cargo P&L",
        prompt: `You buy a 1,000,000-barrel cargo of Bonny Light crude FOB Nigeria at Dated Brent + $1.50/bbl. You charter a Suezmax tanker at <strong>$35,000/day</strong> with <strong>72 hours allowed laytime</strong>.<br>
Loading is delayed by terminal congestion and takes <strong>120 hours</strong>.<br>
Demurrage rate is agreed at <strong>$45,000/day</strong> pro-rata.<br>
<strong>Question:</strong> What is your demurrage liability, and who ultimately bears this cost under standard FOB contracts?`,
        solution: `<strong>1. Laytime & Demurrage Concepts:</strong><br>
• <strong>Laytime:</strong> The agreed time allowed to the charterer for loading/discharging cargo without paying extra fees.<br>
• <strong>Demurrage:</strong> Liquidated damages paid by the charterer to the shipowner for exceeding allowed laytime.<br><br>
<strong>2. Calculation:</strong><br>
• Total loading time = 120 hours.<br>
• Allowed laytime = 72 hours.<br>
• Excess time = 120 - 72 = <strong>48 hours (exactly 2.0 days)</strong>.<br>
• Demurrage due to shipowner = 2 days × $45,000/day = <strong>$90,000</strong>.<br><br>
<strong>3. Contractual Recovery:</strong><br>
Under standard FOB sales terms, if terminal delays are the fault of the FOB Seller (terminal failure to supply cargo as nominated), the Buyer pays the shipowner under the Charter Party, and immediately re-bills/claims the $90,000 demurrage back from the FOB supplier under the commercial sales contract.`
      },
      {
        id: "comm-05",
        category: "commodities",
        difficulty: "hard",
        firms: ["Vitol", "Trafigura", "TotalEnergies"],
        title: "LNG Boil-Off & Geographical Arbitrage: US Gulf to Europe vs Asia",
        prompt: `An LNG carrier loaded with 3.5 million MMBtu of LNG departs Sabine Pass, Louisiana.<br>
• Henry Hub FOB purchase price: <strong>$2.50 / MMBtu</strong> + 15% liquefaction fee.<br>
• European TTF price: <strong>$11.00 / MMBtu</strong> (Voyage: 12 days).<br>
• Asian JKM price: <strong>$13.20 / MMBtu</strong> (Voyage: 26 days via Cape of Good Hope).<br>
• Carrier charter rate: <strong>$90,000 / day</strong>.<br>
• Boil-off gas rate: <strong>0.12% of cargo per day</strong>.<br>
• Canal & port fees: Europe = $150k; Asia = $450k.<br>
<strong>Question:</strong> Calculate the net landed margin for both destinations. Where should the cargo be discharged?`,
        solution: `<strong>1. FOB Cost of LNG:</strong><br>
FOB Price = $2.50 + (15% × $2.50) = <strong>$2.875 / MMBtu</strong>.<br>
Initial cargo volume = 3,500,000 MMBtu.<br>
Total FOB cargo cost = 3,500,000 × $2.875 = <strong>$10,062,500</strong>.<br><br>
<strong>2. Route A: Europe (TTF):</strong><br>
• Days = 12 days.<br>
• Boil-off lost = 12 × 0.12% = 1.44%. Remaining cargo = 3,500,000 × (1 - 0.0144) = <strong>3,449,600 MMBtu</strong>.<br>
• Gross Revenue = 3,449,600 MMBtu × $11.00 = <strong>$37,945,600</strong>.<br>
• Shipping Freight = 12 days × $90,000 = $1,080,000 + $150,000 port fees = <strong>$1,230,000</strong>.<br>
• Net Profit (Europe) = $37,945,600 - $10,062,500 - $1,230,000 = <strong>+$26,653,100</strong>.<br><br>
<strong>3. Route B: Asia (JKM):</strong><br>
• Days = 26 days.<br>
• Boil-off lost = 26 × 0.12% = 3.12%. Remaining cargo = 3,500,000 × (1 - 0.0312) = <strong>3,390,800 MMBtu</strong>.<br>
• Gross Revenue = 3,390,800 MMBtu × $13.20 = <strong>$44,758,560</strong>.<br>
• Shipping Freight = 26 days × $90,000 = $2,340,000 + $450,000 port fees = <strong>$2,790,000</strong>.<br>
• Net Profit (Asia) = $44,758,560 - $10,062,500 - $2,790,000 = <strong>+$31,906,060</strong>.<br><br>
<strong>Conclusion:</strong> Discharge in <strong>Asia (JKM)</strong>! The net advantage is <strong>+$5,252,960</strong> over Europe, more than compensating for the longer voyage, extra boil-off loss, and higher charter costs.`
      },
      {
        id: "comm-06",
        category: "commodities",
        difficulty: "medium",
        firms: ["Cargill", "Bunge", "ADM", "Louis Dreyfus"],
        title: "Agricultural Soybean Crush Spread Dynamics",
        prompt: `Explain the economics of the <strong>Soybean Crush Spread</strong>. What are the standard yield ratios (bushel to meal and oil)? If the USDA WASDE report reports a severe drought in Argentina, what happens to the crush margin in the US?`,
        solution: `<strong>1. Standard Crush Ratio:</strong><br>
One 60-pound bushel of soybeans yields approximately:<br>
• <strong>44 lbs of Soybean Meal</strong> (used for animal feed protein).<br>
• <strong>11 lbs of Soybean Oil</strong> (used for cooking and renewable diesel/biofuel).<br>
• 5 lbs of waste/moisture loss.<br><br>
<strong>2. Spread Formula:</strong><br>
Crush Margin ($/bushel) = [Soybean Meal Price ($/short ton) × 0.022] + [Soybean Oil Price (cents/lb) × 0.11] - Soybean Price ($/bushel).<br><br>
<strong>3. Argentina Drought Impact:</strong><br>
Argentina is the world's #1 exporter of soybean meal. A drought drastically cuts Argentine meal export availability.<br>
Global buyers shift demand to US crushers. Meal prices surge relative to raw beans, driving US crush margins to historical highs as processors run plants at maximum capacity to capture the widening spread.`
      },
      {
        id: "comm-07",
        category: "commodities",
        difficulty: "hard",
        firms: ["BP Trading", "Shell Trading", "Statkraft"],
        title: "Clean Spark Spread & Power Plant Dispatch Economics",
        prompt: `A combined-cycle gas turbine (CCGT) power plant has a heat rate of <strong>7.0 MMBtu / MWh</strong> and emits <strong>0.37 metric tonnes of CO2 / MWh</strong>.<br>
Market prices:<br>
• Wholesale Power: <strong>€95.00 / MWh</strong><br>
• Natural Gas: <strong>€25.00 / MWh (thermal)</strong> (Note: 1 MWh = 3.412 MMBtu)<br>
• EU ETS Carbon Allowances: <strong>€65.00 / tonne</strong><br>
<strong>Questions:</strong><br>
1. Calculate the Clean Spark Spread (CSS) per MWh of electricity.<br>
2. Will the power plant dispatch into the grid?`,
        solution: `<strong>1. Heat Rate Conversion & Gas Fuel Cost:</strong><br>
Heat rate = 7.0 MMBtu / MWh.<br>
Since 1 MWh thermal = 3.412 MMBtu, the plant's thermal efficiency is 3.412 / 7.0 = 48.74%.<br>
Gas cost per MWh power = Gas Price / Thermal Efficiency = €25.00 / 0.4874 = <strong>€51.29 / MWh</strong>.<br><br>
<strong>2. Carbon Emissions Cost:</strong><br>
Carbon cost = 0.37 tonnes CO2/MWh × €65.00/tonne = <strong>€24.05 / MWh</strong>.<br><br>
<strong>3. Clean Spark Spread (CSS):</strong><br>
<code>CSS = Power Price - Fuel Cost - Carbon Cost</code><br>
CSS = €95.00 - €51.29 - €24.05 = <strong>+€19.66 / MWh</strong>.<br><br>
<strong>4. Dispatch Decision:</strong><br>
Yes! Because CSS is strongly positive (+€19.66/MWh > 0), the plant's marginal revenue exceeds its short-run marginal generation costs. The plant is in-the-money and will bid to generate and sell electricity onto the grid.`
      },

      // ==================== PROBABILITY & MATHS SECTION ====================
      {
        id: "prob-01",
        category: "probability",
        difficulty: "medium",
        firms: ["Jane Street", "Optiver", "Citadel"],
        title: "Conditional Expectation on Maximum of Two Dice",
        prompt: `You roll two fair 6-sided dice. Let $X$ be the number on Die 1, and $Y$ be the number on Die 2. Let $M = \\max(X, Y)$.<br>
<strong>Question:</strong> What is the expected value $\\mathbb{E}[M]$?`,
        solution: `<strong>Method 1: Distribution of the Maximum:</strong><br>
The event $\\max(X, Y) \\le k$ occurs if and only if both $X \\le k$ and $Y \\le k$.<br>
Since $X$ and $Y$ are independent:<br>

      }

      container.innerHTML = filtered.map(q => {
        const diffClass = q.difficulty === 'easy' ? 'tag-diff-easy' : (q.difficulty === 'medium' ? 'tag-diff-med' : 'tag-diff-hard');

        return `
          <div class="q-card" id="${q.id}">
            <div class="q-top-row">
              <div class="q-badges">
                <span class="tag">${q.category}</span>
                <span class="tag ${diffClass}">${q.difficulty}</span>
                ${q.firms.map(f => `<span class="tag">${f}</span>`).join('')}
              </div>
            </div>

            <div class="q-title">${q.title}</div>
            <div class="q-prompt">${q.prompt}</div>

            <div class="solution-panel" id="sol-${q.id}">
              <div style="font-family:var(--font-mono); font-size:0.72rem; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; letter-spacing:0.06em;">Technical Solution & Trading Intuition</div>
              <div>${q.solution}</div>
            </div>

            <div class="q-actions">
              <button class="btn-toggle-sol" onclick="toggleSolution('${q.id}')">
                Show solution
              </button>
              <label class="mastered-label">
                <input type="checkbox" onchange="toggleMastered('${q.id}', this.checked)">
                Mark mastered
              </label>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleSolution(id) {
      const panel = document.getElementById(`sol-${id}`);
      const btn = event.currentTarget;
      if (panel.classList.contains('open')) {
        panel.classList.remove('open');
        btn.textContent = 'Show solution';
      } else {
        panel.classList.add('open');
        btn.textContent = 'Hide solution';
      }
    }

    function toggleMastered(id, isMastered) {
      try {
        localStorage.setItem(`mastered_${id}`, isMastered);
      } catch(e) {}
    }

    window.onload = init;
  </script>
</body>
</html>
